<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quartalskompass Blob">
  <defs>
    <path id="blob" d="M33.4 3.1c12.8.4 24.7 9.4 27 21.5 2.5 13.3-4.5 28.3-17.1 34.2-12.5 5.8-28.9.2-36-11.8C.5 35.4 3.6 19.2 14.5 9.7c5.2-4.6 11.8-6.8 18.9-6.6Z" />

    <clipPath id="blob-clip">
      <use href="#blob" />
    </clipPath>

    <linearGradient id="violet-base" x1="8" y1="5" x2="53" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120318" />
      <stop offset="0.46" stop-color="#3d0a49" />
      <stop offset="1" stop-color="#6d176f" />
    </linearGradient>

    <radialGradient id="highlight" cx="0" cy="0" r="1" gradientTransform="translate(19 16) rotate(48) scale(12)">
      <stop stop-color="#fffbe8" stop-opacity=".98" />
      <stop offset=".25" stop-color="#ffd79d" stop-opacity=".58" />
      <stop offset="1" stop-color="#ffd79d" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#ff5b18" flood-opacity=".32" />
      <feDropShadow dx="0" dy="1" stdDeviation="5.5" flood-color="#7b188e" flood-opacity=".42" />
    </filter>

    <filter id="soft-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="soft-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <use href="#blob" fill="url(#violet-base)" />

    <g clip-path="url(#blob-clip)">
      <ellipse cx="47" cy="19" rx="18" ry="16" fill="#ffc247" opacity=".9" filter="url(#soft-orange)" />
      <ellipse cx="48" cy="47" rx="23" ry="19" fill="#ff6a00" opacity=".98" filter="url(#soft-orange)" />
      <ellipse cx="17" cy="47" rx="18" ry="17" fill="#ff2f0a" opacity=".86" filter="url(#soft-red)" />
      <ellipse cx="20" cy="18" rx="14" ry="13" fill="url(#highlight)" />
      <ellipse cx="18.3" cy="15.8" rx="3.8" ry="4.5" fill="#fffdf2" opacity=".86" />
    </g>

    <use href="#blob" fill="none" stroke="#ffb068" stroke-opacity=".28" stroke-width="1.2" />
  </g>
</svg>
